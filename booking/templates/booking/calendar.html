<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь занятий</title>
    
    <!-- Bootstrap (для быстрой стилизации) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    
    <!-- Дополнительные стили для корректного отображения -->
    <style>
        body { margin: 20px; }
        #calendar { max-width: 1400px; margin: 0 auto; }
        .fc-event { cursor: pointer; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Навигация -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'booking:dashboard' %}">🐎 Конный клуб</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'booking:dashboard' %}">Дашборд</a>
                    <a class="nav-link active" href="{% url 'booking:calendar' %}">Календарь</a>
                    <a class="nav-link" href="{% url 'admin:index' %}">Админка</a>
                    <a class="nav-link" href="{% url 'logout' %}">Выйти</a>
                </div>
            </div>
        </nav>

        <h2 class="mb-4">📅 Календарь тренировок</h2>
        
        <!-- Кнопка создания новой записи -->
        <div class="mb-3">
            <a href="{% url 'booking:booking_create' %}" class="btn btn-success">➕ Новая запись</a>
        </div>

        <!-- Контейнер календаря -->
        <div id="calendar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            const calendar = new FullCalendar.Calendar(calendarEl, {
                // Основные настройки
                locale: 'ru',
                firstDay: 1,               // неделя начинается с понедельника
                initialView: 'timeGridWeek',
                slotMinTime: '08:00:00',
                slotMaxTime: '22:00:00',
                allDaySlot: false,
                height: 'auto',
                
                // Заголовок и кнопки переключения видов
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'timeGridDay,timeGridWeek,dayGridMonth'
                },
                
                // Кнопки быстрого создания
                customButtons: {
                    addBooking: {
                        text: '➕ Запись',
                        click: function() {
                            window.location.href = "{% url 'booking:booking_create' %}";
                        }
                    }
                },
                
                // Подгрузка событий из API
                events: {
                    url: "{% url 'booking:bookings_json' %}",
                    method: 'GET',
                    failure: function() {
                        alert('Ошибка загрузки событий. Проверьте консоль.');
                    }
                },
                
                // Цвета событий в зависимости от статуса
                eventDidMount: function(info) {
                    const status = info.event.extendedProps.status;
                    if (status === 'pending') {
                        info.el.style.backgroundColor = '#ffc107';  // жёлтый
                        info.el.style.borderColor = '#ffc107';
                    } else if (status === 'confirmed') {
                        info.el.style.backgroundColor = '#28a745';  // зелёный
                    } else if (status === 'completed') {
                        info.el.style.backgroundColor = '#6c757d';  // серый
                    } else if (status === 'cancelled') {
                        info.el.style.backgroundColor = '#dc3545';  // красный
                    }
                },
                
                // Обработка клика по событию — переход на редактирование
                eventClick: function(info) {
                    const bookingId = info.event.id;
                    if (bookingId) {
                        window.location.href = `/booking/${bookingId}/edit/`;
                    }
                },
                
                // Клик по пустому слоту — создание новой записи с предзаполненной датой
                dateClick: function(info) {
                    const clickedDate = info.dateStr; // формат ISO (2025-04-17)
                    // Откроем форму создания с параметром даты
                    window.location.href = `{% url 'booking:booking_create' %}?date=${clickedDate}`;
                },
                
                // Разрешаем перетаскивание (drag & drop) для изменения времени
                editable: true,
                eventDrop: function(info) {
                    // Здесь можно добавить AJAX-запрос для обновления времени на сервере
                    // Пока просто сообщение в консоль
                    console.log('Событие перемещено:', info.event.id, info.event.start);
                    alert('Для изменения времени используйте кнопку редактирования.');
                    info.revert(); // откатываем изменение (т.к. без серверной обработки)
                },
                
                // Всплывающая подсказка
                eventMouseEnter: function(info) {
                    const event = info.event;
                    const props = event.extendedProps;
                    const tooltip = `${event.title}\nУслуга: ${props.service || '—'}\nСтатус: ${props.status}`;
                    info.el.setAttribute('title', tooltip);
                }
            });
            
            calendar.render();
        });
    </script>
    
    <!-- Bootstrap JS (для навигации) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
