{% extends "booking/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Запись{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Редактирование{% else %}Новая{% endif %} запись</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'booking:calendar' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
